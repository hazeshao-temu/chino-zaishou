<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chino 长裤 · 爆款大爆款图集</title>
<style>
  :root{
    --paper:#FAF8F4; --card:#FFFFFF; --ink:#14130F; --ink2:#3D3A32; --muted:#8C8578;
    --line:#E3DED3; --line2:#CFC8B8; --accent:#8A6A3B; --soft:#F2EEE6;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;
    line-height:1.75;-webkit-font-smoothing:antialiased;}
  img{display:block;}
  button,input,select{font-family:inherit;font-size:inherit;color:inherit;}
  .wrap{max-width:1440px;margin:0 auto;padding:0 18px;}
  @media(min-width:768px){.wrap{padding:0 34px;}}
  @media(min-width:1280px){.wrap{padding:0 56px;}}

  /* ---------- header ---------- */
  header{padding:56px 0 0;}
  .top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);}
  .eyebrow b{font-weight:700;}
  h1{font-family:var(--serif);font-size:clamp(28px,4.2vw,50px);line-height:1.2;
    font-weight:700;letter-spacing:.005em;margin-top:16px;}
  h1 span{color:var(--accent);}
  .lead{margin-top:16px;max-width:660px;font-size:14.5px;line-height:1.95;color:var(--ink2);}
  .facts{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin-top:34px;
    border-top:1px solid var(--ink);border-bottom:1px solid var(--line);}
  @media(min-width:720px){.facts{grid-template-columns:repeat(4,1fr);}}
  .facts div{padding:16px 0 14px 0;border-bottom:1px solid var(--line);}
  @media(min-width:720px){.facts div{border-bottom:0;border-right:1px solid var(--line);padding-right:14px;}
    .facts div:last-child{border-right:0;}}
  .facts b{display:block;font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.3;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .facts b.rng{font-size:17px;letter-spacing:0;}
  .facts span{font-size:12px;color:var(--muted);letter-spacing:.06em;}

  /* ---------- toolbar ---------- */
  .bar{position:sticky;top:0;z-index:40;background:rgba(250,248,244,.94);
    backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);margin-top:26px;}
  .barin{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:11px 0;}
  .search{position:relative;flex:1 1 240px;min-width:200px;}
  .search input{width:100%;background:#fff;border:1px solid var(--line2);border-radius:2px;
    padding:8px 32px 8px 32px;font-size:13.5px;outline:none;transition:border-color .15s;}
  .search input:focus{border-color:var(--ink);}
  .search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);
    font-size:12px;color:var(--muted);}
  .search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;
    background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;display:none;}
  .search .clr.on{display:block;}
  .search .clr:hover{color:var(--ink);}
  .sel{position:relative;flex:0 1 auto;}
  .sel select{appearance:none;background:#fff;border:1px solid var(--line2);border-radius:2px;
    padding:8px 30px 8px 11px;font-size:13px;cursor:pointer;outline:none;max-width:230px;
    transition:border-color .15s;text-overflow:ellipsis;}
  .sel select:focus,.sel select:hover{border-color:var(--ink);}
  .sel::after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);
    font-size:10px;color:var(--muted);pointer-events:none;}
  .counter{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--muted);
    letter-spacing:.02em;white-space:nowrap;}
  .counter b{color:var(--ink);font-weight:600;}
  .ghost{border:1px solid var(--line2);background:#fff;border-radius:2px;padding:8px 12px;
    font-size:13px;cursor:pointer;transition:border-color .15s,background .15s;white-space:nowrap;}
  .ghost:hover{border-color:var(--ink);background:var(--soft);}

  /* ---------- grid ---------- */
  main{padding:26px 0 40px;}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px;}
  @media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 16px;}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));}}
  @media(min-width:1200px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));}}
  @media(min-width:1400px){.grid{grid-template-columns:repeat(6,minmax(0,1fr));}}

  .card{display:flex;flex-direction:column;min-width:0;}
  .frame{position:relative;background:var(--soft);overflow:hidden;cursor:zoom-in;
    border:1px solid var(--line);}
  .frame img{width:100%;aspect-ratio:3/4;object-fit:cover;transition:transform .45s cubic-bezier(.2,.7,.2,1);}
  .card:hover .frame img{transform:scale(1.035);}
  .veil{position:absolute;inset:auto 0 0 0;display:flex;gap:6px;padding:8px;
    background:linear-gradient(to top,rgba(20,19,15,.72),rgba(20,19,15,0));
    opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;}
  .card:hover .veil,.card:focus-within .veil{opacity:1;transform:translateY(0);}
  @media(hover:none){.veil{opacity:1;transform:none;background:rgba(20,19,15,.55);padding:6px;}}
  .act{flex:1 1 auto;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.10);
    color:#fff;font-size:11.5px;padding:5px 6px;border-radius:2px;cursor:pointer;
    white-space:nowrap;transition:background .15s;backdrop-filter:blur(2px);}
  .act:hover{background:rgba(255,255,255,.24);}
  .badge{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;
    font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:2px;letter-spacing:.02em;}
  .fail{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:6px;padding:10px;text-align:center;background:var(--soft);}
  .frame.broken .fail{display:flex;}
  .fail span{font-size:11.5px;color:var(--muted);line-height:1.6;}
  .fail a{font-size:11.5px;color:var(--accent);}

  .info{padding:8px 2px 0;}
  .l1{display:flex;align-items:center;gap:6px;}
  .spu{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cp{margin-left:auto;flex:0 0 auto;border:0;background:none;color:var(--muted);
    font-size:10.5px;cursor:pointer;padding:1px 2px;opacity:0;transition:opacity .15s,color .15s;}
  .card:hover .cp{opacity:1;}
  .cp:hover{color:var(--accent);}
  @media(hover:none){.cp{opacity:1;}}
  .l2{display:flex;align-items:center;justify-content:flex-end;min-height:14px;margin-top:1px;}
  .date{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.01em;}
  .batch{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--accent);}

  .empty{grid-column:1/-1;padding:70px 0;text-align:center;color:var(--muted);font-size:14px;}

  /* ---------- lightbox ---------- */
  .lb{position:fixed;inset:0;background:rgba(250,248,244,.985);z-index:100;display:none;
    flex-direction:column;}
  .lb.open{display:flex;}
  .lbbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);
    flex-wrap:wrap;}
  .lbs{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:-.01em;}
  .lbsub{font-size:12.5px;color:var(--muted);}
  .lbright{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .lbcount{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.02em;}
  .lbbtn{border:1px solid var(--line2);background:#fff;border-radius:2px;font-size:12.5px;
    padding:5px 11px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;}
  .lbbtn:hover{border-color:var(--ink);background:var(--soft);}
  .lbbtn.pri{background:var(--ink);border-color:var(--ink);color:#fff;}
  .lbbtn.pri:hover{opacity:.85;background:var(--ink);}
  .lbstage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
    padding:16px 56px;min-height:0;}
  .lbstage img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;
    border:1px solid var(--line2);background:rgba(255,255,255,.94);border-radius:50%;
    cursor:pointer;font-size:16px;color:var(--ink2);display:flex;align-items:center;
    justify-content:center;transition:border-color .15s,color .15s;}
  .nav:hover{border-color:var(--ink);color:var(--ink);}
  .nav.p{left:10px;} .nav.n{right:10px;}
  @media(max-width:640px){.lbstage{padding:10px 6px;} .nav{display:none;}}

  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);background:var(--ink);
    color:#fff;font-size:12.5px;padding:8px 16px;border-radius:2px;opacity:0;
    pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;
    font-family:var(--mono);letter-spacing:.02em;}
  .toast.on{opacity:1;transform:translate(-50%,0);}

  footer{border-top:1px solid var(--ink);padding:20px 0 56px;display:flex;flex-wrap:wrap;
    gap:8px 20px;justify-content:space-between;font-size:12px;color:var(--muted);}
  footer b{font-weight:600;color:var(--ink2);}
</style>
</head>

/product/temu-avi/image-crop/a1a6b734-5b2f-4eb1-8fe4-e46071d3c8d6.jpg","first":"2023-11-14 16:08:21","last":"2023-11-14 16:08:21","batch":1}];
const grid = document.getElementById('grid');
const q = document.getElementById('q');
const clr = document.getElementById('clr');
const sortSel = document.getElementById('sort');
const shown = document.getElementById('shown');

let view = [];
let cur = 0;

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function d10(s){ return s ? s.slice(0,10) : '—'; }

function apply(){
  const kw = q.value.trim().toLowerCase();
  let arr = DATA.filter(d => !kw || d.spu.indexOf(kw) > -1);
  const mode = sortSel.value;
  arr.sort((a,b) => {
    if (mode === 'first-desc') return b.first.localeCompare(a.first);
    if (mode === 'first-asc')  return a.first.localeCompare(b.first);
    if (mode === 'batch-desc') return b.batch - a.batch || b.first.localeCompare(a.first);
    return a.spu.localeCompare(b.spu);
  });
  view = arr;
  render();
  return arr;
}

function render(){
  shown.textContent = view.length;
  if (!view.length){
    grid.innerHTML = '<p class="empty">没有匹配的商品，换个 SPU ID 试试。</p>';
    return;
  }
  const h = [];
  for (let i = 0; i < view.length; i++){
    const d = view[i];
    h.push(
      '<article class="card" data-i="' + i + '">' +
        '<div class="frame">' +
          '<img src="' + esc(d.img) + '" alt="' + esc('SPU ' + d.spu) + '"' +
            (i < 12 ? '' : ' loading="lazy"') + ' decoding="async" referrerpolicy="no-referrer"' +
            ' onerror="this.parentNode.classList.add(&quot;broken&quot;)">' +
          '<div class="fail"><span>头图加载失败</span><a href="' + esc(d.img) + '" target="_blank" rel="noopener">打开原图链接</a></div>' +
          (d.batch > 1 ? '<span class="badge">×' + d.batch + '</span>' : '') +
          '<div class="veil">' +
            '<button class="act js-copy" data-spu="' + esc(d.spu) + '">复制 SPU</button>' +
            '<button class="act js-open">查看大图</button>' +
          '</div>' +
        '</div>' +
        '<div class="info">' +
          '<div class="l1"><span class="spu">' + esc(d.spu) + '</span>' +
            '<button class="cp js-copy" data-spu="' + esc(d.spu) + '">复制</button></div>' +
          '<div class="l2">' +
            (d.batch > 1 ? '<span class="batch">' + d.batch + ' 次加站</span>' : '') + '</div>' +
        '</div>' +
      '</article>'
    );
  }
  grid.innerHTML = h.join('');
}

/* toast + copy */
const toast = document.getElementById('toast');
let tt = null;
function pop(msg){
  toast.textContent = msg;
  toast.classList.add('on');
  clearTimeout(tt);
  tt = setTimeout(() => toast.classList.remove('on'), 1500);
}
function copyText(txt, msg){
  const done = () => pop(msg || ('已复制 ' + txt));
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(() => fallback(txt, done));
  } else fallback(txt, done);
}
function fallback(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ pop('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}

/* interactions */
q.addEventListener('input', () => {
  clr.classList.toggle('on', q.value.length > 0);
  apply();
});
clr.addEventListener('click', () => { q.value = ''; clr.classList.remove('on'); apply(); q.focus(); });
sortSel.addEventListener('change', apply);

grid.addEventListener('click', e => {
  const cp = e.target.closest('.js-copy');
  if (cp){ e.stopPropagation(); copyText(cp.dataset.spu); return; }
  const card = e.target.closest('.card');
  if (card) openLB(Number(card.dataset.i));
});

document.getElementById('copyall').addEventListener('click', () => {
  if (!view.length) return;
  copyText(view.map(d => d.spu).join('\n'), '已复制 ' + view.length + ' 个 SPU ID');
});

/* lightbox */
const lb = document.getElementById('lb');
const lbimg = document.getElementById('lbimg');
const lbs = document.getElementById('lbs');
const lbsub = document.getElementById('lbsub');
const lbc = document.getElementById('lbc');

function openLB(i){
  show(i);
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLB(){
  lb.classList.remove('open');
  document.body.style.overflow = '';
  lbimg.removeAttribute('src');
}
function show(i){
  if (!view.length) return;
  if (i < 0) i = view.length - 1;
  if (i >= view.length) i = 0;
  cur = i;
  const d = view[i];
  lbimg.src = d.img;
  lbimg.alt = 'SPU ' + d.spu;
  lbs.textContent = d.spu;
  lbsub.textContent = d.batch > 1 ? ('共 ' + d.batch + ' 次加站') : '';
  lbc.textContent = (i + 1) + ' / ' + view.length;
}
document.getElementById('lbclose').addEventListener('click', closeLB);
document.getElementById('lbcopy').addEventListener('click', () => {
  if (view[cur]) copyText(view[cur].spu);
});
document.getElementById('lbp').addEventListener('click', () => show(cur - 1));
document.getElementById('lbn').addEventListener('click', () => show(cur + 1));
lb.addEventListener('click', e => {
  if (e.target === lb || e.target.classList.contains('lbstage')) closeLB();
});
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowLeft') show(cur - 1);
  if (e.key === 'ArrowRight') show(cur + 1);
});

apply();
</script>
