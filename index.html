<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHINO（商务休闲风）长裤爆款视觉</title>
<style>
  :root{
    --paper:#F1ECE1;
    --paper-2:#E7E0D1;
    --ink:#1B1914;
    --ink-soft:#5B5548;
    --olive:#3F4430;
    --khaki:#A78C58;
    --line:rgba(27,25,20,.16);
    --gap:1px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* 纸张纹理 */
  body::before{
    content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.045;
    background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3'/%3E%3C/filter%3E%3Crect width='240' height='240' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  ::selection{background:var(--olive);color:var(--paper);}

  /* ---------- 顶栏 ---------- */
  header{
    position:sticky;top:0;z-index:100;
    background:rgba(241,236,225,.86);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  .bar{
    max-width:1680px;margin:0 auto;
    display:flex;align-items:center;gap:28px;
    padding:14px 32px;
  }
  .brand{display:flex;align-items:baseline;gap:10px;flex-shrink:0;}
  .brand b{
    font-family:Georgia,'Songti SC','Noto Serif SC',serif;
    font-size:19px;letter-spacing:.14em;font-weight:600;
  }
  .brand i{
    font-style:normal;font-size:10px;letter-spacing:.34em;
    text-transform:uppercase;color:var(--khaki);
  }
  .search{
    position:relative;flex:1;max-width:420px;margin-left:auto;
  }
  .search input{
    width:100%;border:1px solid var(--line);background:transparent;
    border-radius:999px;padding:9px 16px 9px 36px;
    font-size:13px;color:var(--ink);outline:none;
    transition:.25s;font-family:inherit;
  }
  .search input:focus{border-color:var(--olive);background:rgba(255,255,255,.45);}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.45;}

  /* ---------- Hero ---------- */
  .hero{
    max-width:1680px;margin:0 auto;
    padding:72px 32px 46px;
    border-bottom:1px solid var(--line);
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(300px,40%);
    gap:56px;
    align-items:end;
  }
  .spec{
    border:1px solid var(--line);
    background:rgba(255,255,255,.34);
    padding:22px 24px 24px;
    display:flex;flex-direction:column;
  }
  .spec .row{display:grid;grid-template-columns:78px 1fr;gap:16px;padding:14px 0;}
  .spec .row:first-child{padding-top:0;}
  .spec .row:last-child{padding-bottom:0;}
  .spec .row + .row{border-top:1px solid var(--line);}
  .spec dt{
    font-size:11px;letter-spacing:.16em;color:var(--khaki);
    padding-top:3px;white-space:nowrap;font-weight:600;
  }
  .spec dd{
    font-size:12.8px;line-height:1.9;color:var(--ink-soft);letter-spacing:.01em;
  }
  .cat{
    display:inline-block;margin-bottom:28px;
    font-size:12.5px;letter-spacing:.1em;line-height:1;
    color:var(--olive);
    border:1px solid rgba(63,68,48,.32);
    background:rgba(167,140,88,.12);
    padding:8px 14px;border-radius:2px;
  }
  h1{
    font-family:Georgia,'Songti SC','Noto Serif SC',serif;
    font-weight:500;
  }
  h1 .en{
    display:block;
    font-size:clamp(54px,9.6vw,136px);
    line-height:.88;letter-spacing:.055em;
  }
  h1 .cn{
    display:block;margin-top:22px;
    font-size:clamp(20px,2.5vw,33px);
    line-height:1.35;letter-spacing:.07em;font-weight:400;
  }
  h1 .cn em{font-style:normal;color:var(--khaki);}

  /* ---------- 网格 ---------- */
  main{max-width:1680px;margin:0 auto;padding:0 32px 110px;}
  .resline{
    padding:20px 0 14px;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink-soft);display:none;
  }
  .resline.on{display:block;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(172px,1fr));
    gap:var(--gap);
    background:var(--line);
    border:1px solid var(--line);
    border-top:none;
  }
  .card{
    position:relative;display:block;text-decoration:none;color:inherit;
    background:var(--paper);
    opacity:0;transform:translateY(14px);
    transition:opacity .6s ease,transform .6s cubic-bezier(.22,1,.36,1);
  }
  .card.in{opacity:1;transform:none;}
  .thumb{
    position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--paper-2);
  }
  .thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .8s cubic-bezier(.22,1,.36,1),filter .5s;
    filter:saturate(.94);
  }
  .card:hover .thumb img{transform:scale(1.045);filter:saturate(1.03);}
  .idx{
    position:absolute;top:8px;left:9px;z-index:2;
    font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    font-size:9.5px;letter-spacing:.1em;color:rgba(255,255,255,.92);
    background:rgba(27,25,20,.55);padding:2px 5px;
    backdrop-filter:blur(3px);
  }
  .veil{
    position:absolute;inset:0;z-index:2;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:12px;
    background:linear-gradient(to top,rgba(30,34,22,.9) 0%,rgba(30,34,22,.42) 46%,rgba(30,34,22,0) 76%);
    opacity:0;transition:opacity .35s ease;
  }
  .card:hover .veil{opacity:1;}
  .veil .go{
    font-size:12px;letter-spacing:.1em;color:#F4F0E5;font-weight:500;
    transform:translateY(6px);transition:transform .4s cubic-bezier(.22,1,.36,1);
  }
  .veil .spu{
    margin-top:5px;font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    font-size:10px;color:rgba(244,240,229,.62);letter-spacing:.04em;
    transform:translateY(6px);transition:transform .4s .04s cubic-bezier(.22,1,.36,1);
  }
  .card:hover .veil .go,.card:hover .veil .spu{transform:none;}
  .foot{
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;padding:10px 12px 12px;
    border-top:1px solid var(--line);
  }
  .foot .id{
    font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    font-size:10.5px;color:var(--ink-soft);letter-spacing:.02em;
  }
  .copy{
    border:none;background:none;cursor:pointer;padding:2px;
    opacity:0;transition:.25s;color:var(--ink-soft);line-height:0;
  }
  .card:hover .copy{opacity:.75;}
  .copy:hover{opacity:1!important;color:var(--olive);}
  .copy.done{color:var(--olive);opacity:1!important;}

  .empty{
    display:none;padding:120px 0;text-align:center;
    font-family:Georgia,'Songti SC',serif;font-size:22px;color:var(--ink-soft);
  }
  .empty.on{display:block;}

  #top{
    position:fixed;right:26px;bottom:26px;z-index:200;
    width:42px;height:42px;border-radius:50%;
    border:1px solid var(--line);background:rgba(241,236,225,.9);
    backdrop-filter:blur(8px);cursor:pointer;
    display:grid;place-items:center;color:var(--ink-soft);
    opacity:0;transform:translateY(12px);pointer-events:none;
    transition:.35s cubic-bezier(.22,1,.36,1);
  }
  #top.on{opacity:1;transform:none;pointer-events:auto;}
  #top:hover{color:var(--olive);border-color:var(--olive);}

  footer{
    border-top:1px solid var(--line);
    max-width:1680px;margin:0 auto;padding:34px 32px 60px;
    display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
  }

  @media(max-width:1080px){
    .hero{grid-template-columns:1fr;gap:36px;align-items:start;}
  }

  @media(max-width:900px){
    .bar{padding:12px 18px;gap:14px;flex-wrap:wrap;}
    .search{max-width:100%;order:3;flex-basis:100%;margin-left:0;}
    .hero{padding:44px 18px 28px;grid-template-columns:1fr;gap:34px;align-items:start;}
    main{padding:0 18px 70px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(142px,1fr));}
    #top{
    position:fixed;right:26px;bottom:26px;z-index:200;
    width:42px;height:42px;border-radius:50%;
    border:1px solid var(--line);background:rgba(241,236,225,.9);
    backdrop-filter:blur(8px);cursor:pointer;
    display:grid;place-items:center;color:var(--ink-soft);
    opacity:0;transform:translateY(12px);pointer-events:none;
    transition:.35s cubic-bezier(.22,1,.36,1);
  }
  #top.on{opacity:1;transform:none;pointer-events:auto;}
  #top:hover{color:var(--olive);border-color:var(--olive);}

  footer{padding:28px 18px 44px;}
  }
</style>
</head>

<header>

<main>

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const q = document.getElementById('q');
const FRONT = id => 'https://www.temu.com/goods.html?goods_id=' + id;

function pad(n){ return String(n).padStart(3,'0'); }

function card([id,img],i){
  const a = document.createElement('a');
  a.className = 'card';
  a.href = FRONT(id);
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.dataset.id = id;
  a.innerHTML =
    '<div class="thumb">'+
      '<span class="idx">'+pad(i+1)+'</span>'+
      '<img loading="lazy" decoding="async" src="'+img+'" alt="SPU '+id+'">'+
      '<div class="veil"><span class="go">查看前台商品 ↗</span><span class="spu">'+id+'</span></div>'+
    '</div>'+
    '<div class="foot"><span class="id">'+id+'</span>'+
      '<button class="copy" title="复制前台链接" aria-label="复制链接">'+
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>'+
      '</button></div>';
  return a;
}

function render(list, keyword){
  const resline = document.getElementById('resline');
  if(keyword){ resline.classList.add('on'); resline.textContent = '筛选结果 · ' + list.length + ' 款'; }
  else { resline.classList.remove('on'); }
  grid.innerHTML = '';
  const frag = document.createDocumentFragment();
  list.forEach((d,i)=>frag.appendChild(card(d,i)));
  grid.appendChild(frag);
  empty.classList.toggle('on', list.length === 0);
  observeAll();
}

let io;
function observeAll(){
  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('.card').forEach(c=>c.classList.add('in'));
    return;
  }
  if(!io){
    io = new IntersectionObserver((es)=>{
      es.forEach(e=>{
        if(e.isIntersecting){
          const el = e.target;
          const count = [...grid.children].indexOf(el);
          el.style.transitionDelay = Math.min(count%8,7)*40 + 'ms';
          el.classList.add('in');
          io.unobserve(el);
        }
      });
    },{rootMargin:'120px 0px'});
  }
  document.querySelectorAll('.card').forEach(c=>io.observe(c));
}

// 复制链接
grid.addEventListener('click', e=>{
  const btn = e.target.closest('.copy');
  if(!btn) return;
  e.preventDefault(); e.stopPropagation();
  const id = btn.closest('.card').dataset.id;
  const link = FRONT(id);
  const done = ()=>{
    btn.classList.add('done');
    setTimeout(()=>btn.classList.remove('done'),1200);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(link).then(done).catch(()=>fallback(link,done));
  }else{ fallback(link,done); }
});
function fallback(text,cb){
  const t = document.createElement('textarea');
  t.value = text; t.style.position='fixed'; t.style.opacity='0';
  document.body.appendChild(t); t.select();
  try{ document.execCommand('copy'); cb(); }catch(err){}
  document.body.removeChild(t);
}

// 搜索
let timer;
q.addEventListener('input', ()=>{
  clearTimeout(timer);
  timer = setTimeout(()=>{
    const k = q.value.trim();
    render(k ? DATA.filter(d=>d[0].includes(k)) : DATA, k);
  },140);
});

// 回到顶部
const topBtn = document.getElementById('top');
window.addEventListener('scroll', ()=>{
  topBtn.classList.toggle('on', window.scrollY > 700);
}, {passive:true});
topBtn.addEventListener('click', ()=>window.scrollTo({top:0,behavior:'smooth'}));

render(DATA);
</script>
